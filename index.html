<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Download</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f6f8;
    font-family: Arial, sans-serif;
    color: #27364a;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid #e2e5e9;
    border-radius: 5px;
    padding: 42px 35px;
    text-align: center;
}

.zip-icon {
    width: 65px;
    height: 75px;
    margin-bottom: 20px;
}

h2 {
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 25px;
}

.filename {
    font-size: 14px;
    font-weight: 600;
    color: #34445b;
    background: #f7f8fa;
    border: 1px solid #e6e9ed;
    padding: 15px;
    overflow-wrap: anywhere;
    margin-bottom: 24px;
}

.download {
    display: block;
    width: 100%;
    padding: 14px;
    background: #263b59;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    border-radius: 3px;
    font-family: Arial, sans-serif;
    border: none;
    cursor: pointer;
}

.download:hover {
    background: #354e70;
}

.download:disabled {
    opacity: 0.7;
    cursor: wait;
}

.mobile {
    display: none;
}

#download-error {
    display: none;
    color: #c0392b;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.5;
}

@media (max-width: 767px) {
    .desktop {
        display: none;
    }

    .mobile {
        display: block;
    }
}
</style>

<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer>
</script>

</head>

<body>

<div class="card">

    <div class="desktop">

        <!-- Error message appears above ZIP logo -->
        <div id="download-error" role="alert" aria-live="polite"></div>

        <svg class="zip-icon"
             viewBox="0 0 80 95"
             xmlns="http://www.w3.org/2000/svg">

            <path d="M12 3 H49 L69 23 V87 Q69 91 65 91 H12 Q8 91 8 87 V7 Q8 3 12 3Z"
                  fill="white" stroke="#64748b" stroke-width="1.8"/>

            <path d="M49 3 V23 H69"
                  fill="#edf0f4" stroke="#64748b" stroke-width="1.8"/>

            <path d="M35 27h9v7h-9zm0 9h9v7h-9zm0 9h9v7h-9zm0 9h9v7h-9z"
                  fill="#b58b50"/>

            <text x="40" y="79" text-anchor="middle"
                  font-size="12" font-weight="bold"
                  fill="#263b59">ZIP</text>
        </svg>

        <h2>File Download</h2>

        <div class="filename">
            Shared_Document.zip
        </div>

        <form id="download-form" action="/download" method="POST">

            <div
              class="cf-turnstile"
              data-sitekey="0x4AAAAAAGVlpWuR6_op_Mu5"
              data-theme="light">
            </div>

            <button type="submit" class="download">
                Download
            </button>

        </form>

    </div>

    <div class="mobile">

        <h2>Desktop Access Required</h2>

        <p style="font-size:14px;color:#7b8491;line-height:1.7;">
            Please access this file from a desktop or laptop computer.
        </p>

    </div>

</div>

<script>

// Download form handling
document.getElementById("download-form").addEventListener("submit", async function(e) {

    e.preventDefault();

    const form = this;
    const errorBox = document.getElementById("download-error");
    const button = form.querySelector(".download");

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
    }

    // Hide previous error
    errorBox.style.display = "none";
    errorBox.textContent = "";

    // Prevent multiple submissions
    if (button.disabled) {
        return;
    }

    // Get Turnstile token
    const token = form.querySelector(
        '[name="cf-turnstile-response"]'
    )?.value;

    // Stop if verification has not been completed
    if (!token) {
        showError(
            "Please complete the security verification before downloading."
        );
        return;
    }

    button.disabled = true;
    button.textContent = "Preparing download...";

    try {

        const response = await fetch("/download", {
            method: "POST",
            body: new URLSearchParams(new FormData(form))
        });

        // Handle server errors without redirecting
        if (!response.ok) {

            if (response.status === 403) {
                showError(
                    "Verification failed or expired. Please try again."
                );
            } else if (response.status === 404) {
                showError("The ZIP file could not be found.");
            } else {
                showError("Download failed. Please try again.");
            }

            if (window.turnstile) {
                turnstile.reset();
            }

            return;
        }

        // Get ZIP file
        const blob = await response.blob();

        // Get server-generated filename
        const disposition = response.headers.get("Content-Disposition");

        let filename = "Shared_Document.zip";

        if (disposition) {
            const match = disposition.match(/filename="([^"]+)"/);

            if (match) {
                filename = match[1];
            }
        }

        // Trigger browser download without leaving the page
        const downloadUrl = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = downloadUrl;
        link.download = filename;

        document.body.appendChild(link);
        link.click();
        link.remove();

        // Release download URL after browser has started the download
        setTimeout(() => {
            URL.revokeObjectURL(downloadUrl);
        }, 1000);

        // Reset Turnstile for another attempt
        if (window.turnstile) {
            turnstile.reset();
        }

    } catch (error) {

        console.error("Download error:", error);

        showError(
            "A connection error occurred. Please try again."
        );

        if (window.turnstile) {
            turnstile.reset();
        }

    } finally {

        button.disabled = false;
        button.textContent = "Download";

    }

});


// Disable right-click
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});


// Disable common dev shortcuts
document.addEventListener('keydown', function(e) {

    // F12
    if (e.key === "F12") {
        e.preventDefault();
    }

    // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey &&
        ['I','J','C'].includes(e.key.toUpperCase())) {
        e.preventDefault();
    }

    // Ctrl+U (view source)
    if (e.ctrlKey && e.key.toUpperCase() === 'U') {
        e.preventDefault();
    }

});

</script>

</body>
</html>
